name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        env:
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAOPAY_SECRET_KEY: ${{ secrets.KAKAOPAY_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
          NAVER_MAPS_CLIENT_SECRET: ${{ secrets.NAVER_MAPS_CLIENT_SECRET }}
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          SHORT_SHA=${{ steps.vars.outputs.short_sha }}
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}

          docker build --platform linux/arm64 -t $IMAGE_URI:$SHORT_SHA .
          docker push $IMAGE_URI:$SHORT_SHA

          echo "✅ Pushed: $IMAGE_URI:$SHORT_SHA"

   deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Launch Template
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
        run: |
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          USER_DATA=$(cat <<'USERDATA' | sed "s|__IMAGE_TAG__|${IMAGE_TAG}|g; s|__AWS_ACCOUNT_ID__|${AWS_ACCOUNT_ID}|g; s|__AWS_REGION__|${AWS_REGION}|g; s|__ECR_REPOSITORY__|${ECR_REPOSITORY}|g" | base64 -w 0
          #!/bin/bash
          set -e
          AWS_REGION="__AWS_REGION__"
          AWS_ACCOUNT_ID="__AWS_ACCOUNT_ID__"
          ECR_REPOSITORY="__ECR_REPOSITORY__"
          IMAGE_TAG="__IMAGE_TAG__"
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          # dnf update는 부팅 시간만 늘려서 뺐다 (Docker 설치에는 필요 없음)
          dnf install -y docker
          systemctl enable docker
          systemctl start docker

          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          docker pull ${ECR_URI}:${IMAGE_TAG}

          docker run -d \
            -p 8080:8080 \
            --restart unless-stopped \
            --name ci-demo \
            -e SPRING_PROFILES_ACTIVE=prod \
            ${ECR_URI}:${IMAGE_TAG}
          USERDATA
          )

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id ${LAUNCH_TEMPLATE_ID} \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${USER_DATA}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "✅ Launch Template v${NEW_VERSION} 생성 완료"

          aws ec2 modify-launch-template \
            --launch-template-id ${LAUNCH_TEMPLATE_ID} \
            --default-version ${NEW_VERSION}

          echo "✅ 기본 버전 → v${NEW_VERSION} 변경 완료"

      # 이전 실행이 남긴 Refresh가 있으면 취소하고 끝날 때까지 기다린다 (InstanceRefreshInProgress 방지)
      - name: Cancel previous Instance Refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: |
          STATUS=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${ASG_NAME} \
            --max-records 1 \
            --query 'InstanceRefreshes[0].Status' \
            --output text)

          echo "📌 직전 Refresh 상태: ${STATUS}"

          if [ "${STATUS}" = "Pending" ] || [ "${STATUS}" = "InProgress" ] || [ "${STATUS}" = "Cancelling" ]; then
            if [ "${STATUS}" != "Cancelling" ]; then
              echo "⚠️ 진행 중인 Refresh를 취소합니다"
              aws autoscaling cancel-instance-refresh --auto-scaling-group-name ${ASG_NAME}
            fi

            for i in $(seq 1 10); do
              sleep 30

              STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name ${ASG_NAME} \
                --max-records 1 \
                --query 'InstanceRefreshes[0].Status' \
                --output text)

              echo "취소 대기 ${i}/10 - 상태: ${STATUS}"

              if [ "${STATUS}" = "Cancelled" ]; then
                break
              fi
            done

            if [ "${STATUS}" != "Cancelled" ]; then
              echo "❌ 이전 Refresh 취소가 5분 안에 끝나지 않았습니다 (${STATUS})"
              exit 1
            fi
          fi

          echo "✅ 새 Refresh를 시작할 수 있습니다"

      - name: Start Instance Refresh
        id: refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: |
          # InstanceWarmup 120 → 60: healthy 판정 뒤 다음 인스턴스로 넘어가기 전 대기 시간
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${ASG_NAME} \
            --preferences '{
              "MinHealthyPercentage": 100,
              "InstanceWarmup": 60
            }' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "refresh_id=${REFRESH_ID}" >> $GITHUB_OUTPUT
          echo "✅ Instance Refresh 시작: ${REFRESH_ID}"

      - name: Wait for Instance Refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
          REFRESH_ID: ${{ steps.refresh.outputs.refresh_id }}
        run: |
          echo "⏳ Instance Refresh 완료 대기 중..."
          echo "Refresh ID: ${REFRESH_ID}"
          echo ""

          # 15회 × 60초 = 15분. 배포는 보통 5~7분이라 두 배 넘게 여유
          for i in $(seq 1 15); do

            echo "=========================================="
            echo "시도 ${i}/15"
            echo "=========================================="

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${ASG_NAME} \
              --instance-refresh-ids ${REFRESH_ID} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "📌 Refresh 상태: ${STATUS}"

            echo ""
            echo "📊 Refresh 상세 정보:"
            aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${ASG_NAME} \
              --instance-refresh-ids ${REFRESH_ID} \
              --query 'InstanceRefreshes[0]' \
              --output json || true

            echo ""
            echo "🖥️ ASG 인스턴스 상태:"
            aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names ${ASG_NAME} \
              --query 'AutoScalingGroups[0].Instances[*].[InstanceId,LifecycleState,HealthStatus,LaunchTemplate.Version]' \
              --output table || true

            echo ""

            if [ "${STATUS}" = "Successful" ]; then
              echo "✅ Instance Refresh 성공! 배포 완료!"
              exit 0

            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ]; then
              echo "❌ Instance Refresh 실패: ${STATUS}"

              echo ""
              echo "❗ Refresh 전체 정보:"
              aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name ${ASG_NAME} \
                --instance-refresh-ids ${REFRESH_ID} \
                --output json || true

              exit 1
            fi

            sleep 60
          done

          echo ""
          echo "❌ Instance Refresh 타임아웃 (15분 초과)"

          echo ""
          echo "========== 최종 Refresh 정보 =========="
          aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name ${ASG_NAME} \
            --instance-refresh-ids ${REFRESH_ID} \
            --output json || true

          echo ""
          echo "========== 최종 ASG 인스턴스 정보 =========="
          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${ASG_NAME} \
            --query 'AutoScalingGroups[0].Instances[*].[InstanceId,LifecycleState,HealthStatus,LaunchTemplate.Version]' \
            --output table || true

          exit 1
